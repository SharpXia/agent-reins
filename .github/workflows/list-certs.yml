name: list-certs
# 临时工具：只读查询账号当前有效证书列表（吊销的证书不会出现在返回里）。
# 不创建、不吊销任何证书。查完即删。
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Query certificates (read-only)
        env:
          P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          KID: ${{ secrets.ASC_API_KEY_ID }}
          ISS: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          echo "$P8" | base64 --decode > /tmp/k.p8
          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"ES256","kid":"%s"}' "$KID" | openssl dgst -sha256 -binary | b64url)
          PAYLOAD=$(printf '{"iss":"%s","iat":%d,"exp":%d,"aud":"appstoreconnect-v1"}' "$ISS" "$NOW" "$((NOW+1200))" | openssl dgst -sha256 -binary | b64url)
          SI="${HEADER}.${PAYLOAD}"
          DER=$(printf '%s' "$SI" | openssl dgst -sha256 -sign /tmp/k.p8 -binary)
          SIG=$(printf '%s' "$DER" | python3 -c "
          import sys
          der = sys.stdin.buffer.read()
          z = bytes([0])
          r_len = der[3]; r = der[4:4+r_len]; s = der[6+r_len:]
          r = r.lstrip(z).rjust(32, z); s = s.lstrip(z).rjust(32, z)
          sys.stdout.write((r+s).hex())
          ")
          JWT="${SI}.${SIG}"
          curl -s --globoff -H "Authorization: Bearer $JWT" \
            "https://api.appstoreconnect.apple.com/v1/certificates?limit=50" \
          | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if 'errors' in d:
              for e in d['errors']: print('API_ERROR', e.get('status'), e.get('code'), e.get('detail'))
          elif not d.get('data'):
              print('NO_VALID_CERTS（账号当前没有任何有效证书）')
          else:
              print(f'共 {len(d[\"data\"])} 张有效证书：')
              for c in d['data']:
                  a = c['attributes']
                  print(f\"  {a['certificateType']:<24} {a['displayName']:<45} 到期 {a['expirationDate'][:10]}\")
          "
          rm -f /tmp/k.p8
