name: TestFlight

# 远程验收出包：手动 dispatch 或推 beta-* tag。
# 依赖仓库 Secrets：ASC_API_KEY_P8_BASE64 / ASC_API_KEY_ID / ASC_API_ISSUER_ID / APPLE_TEAM_ID
# （ASC = App Store Connect，Team API Key；.p8 内容 base64 后入 secrets，绝不入库）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'beta-*'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ios-testflight:
    name: iOS → TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write ASC API key to disk
        run: |
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Write Config.local.xcconfig (TEAM_ID + JAVA_HOME)
        run: |
          cat > iosApp/Configuration/Config.local.xcconfig <<EOF
          TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
          JAVA_HOME=$JAVA_HOME
          EOF

      - name: Build fastlane api key json
        run: |
          python3 - <<'PYEOF'
          import base64, json, os
          key = base64.b64decode(os.environ["ASC_API_KEY_P8_BASE64"]).decode()
          cfg = {
              "key_id": os.environ["ASC_API_KEY_ID"],
              "issuer_id": os.environ["ASC_API_ISSUER_ID"],
              "key": key,
              "in_house": False,
          }
          with open(os.environ["RUNNER_TEMP"] + "/asc-key.json", "w") as f:
              json.dump(cfg, f)
          PYEOF
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}

      - name: Revoke stale CI development certificates (每轮 runner 各建一张，防上限)
        run: |
          python3 - <<'PYEOF'
          import base64, binascii, json, os, subprocess, tempfile, time, urllib.request

          cfg = json.load(open(os.environ["RUNNER_TEMP"] + "/asc-key.json"))
          now = int(time.time())
          header = base64.urlsafe_b64encode(json.dumps({"alg": "ES256", "kid": cfg["key_id"], "typ": "JWT"}).encode()).rstrip(b"=").decode()
          payload = base64.urlsafe_b64encode(json.dumps({"iss": cfg["issuer_id"], "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}).encode()).rstrip(b"=").decode()
          si = f"{header}.{payload}".encode()
          with tempfile.NamedTemporaryFile("w", suffix=".pem") as f:
              f.write(cfg["key"]); f.flush()
              der = subprocess.run(["openssl", "dgst", "-sha256", "-sign", f.name], input=si, capture_output=True).stdout
          i, rl = 2, der[3]
          r = der[4:4+rl]; ss = der[4+rl+2:]
          rs = r.lstrip(b"\x00").rjust(32, b"\x00") + ss.lstrip(b"\x00").rjust(32, b"\x00")
          sig = base64.urlsafe_b64encode(rs).rstrip(b"=").decode()
          jwt = f"{header}.{payload}.{sig}"

          def req(path, method="GET"):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method,
                                         headers={"Authorization": f"Bearer {jwt}"})
              return urllib.request.urlopen(r)

          data = json.load(req("/v1/certificates?filter[certificateType]=IOS_DEVELOPMENT&limit=200"))
          certs = data.get("data", [])
          print(f"iOS development certs: {len(certs)}")
          for c in certs:
              print("revoking", c["id"], c["attributes"].get("displayName"))
              try:
                  req(f"/v1/certificates/{c['id']}", "DELETE")
              except Exception as e:
                  print("  revoke failed (continuing):", e)
          PYEOF

      - name: Archive (App Store signing, build number = epoch seconds)
        run: |
          set -o pipefail
          BUILD=$(date +%s)
          # marketing version 从 tag 推导（beta-0.2.7 → 0.2.7）：TestFlight 可读的里程碑号
          MV=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^beta-//')
          echo "MARKETING_VERSION=$MV" >> "$GITHUB_ENV"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AgentReins.xcarchive \
            CURRENT_PROJECT_VERSION=$BUILD \
            MARKETING_VERSION=${MARKETING_VERSION} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_API_ISSUER_ID }}" \
            archive 2>&1 | tail -40

      - name: Export IPA (TestFlight / app-store-connect)
        run: |
          cat > build/ExportOptions.plist <<'PLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLEOF
          xcodebuild \
            -exportArchive \
            -archivePath build/AgentReins.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_API_ISSUER_ID }}" \
            2>&1 | tail -60

      - name: Upload to TestFlight
        run: |
          brew install fastlane
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc-key.json" \
            --ipa build/ipa/AgentReins.ipa \
            --skip_waiting

      - name: Cleanup key material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/asc-key.json"

      - name: Summary
        run: |
          echo "✅ 已上传 TestFlight：版本 ${{ env.MARKETING_VERSION }}（build ${{ env.BUILD_NUMBER }}）。处理约 10–30 分钟后，TestFlight app 内可见/可更新。" >> "$GITHUB_STEP_SUMMARY"
