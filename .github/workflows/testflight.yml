name: TestFlight

# 远程验收出包——固定分发证书版（2026-10-29 改造）。
# 背景：此前 automatic 签名在空钥匙串 runner 上每次新建分发证书，Apple 超限（2 张）
# 自动吊销最老一张，反复吊销用户本机证书。现改为 CI 导入固定 .p12（含私钥），
# archive 前有身份闸门：证书没进来就中止，xcodebuild 永远不在无证书状态下运行，
# -allowProvisioningUpdates 只用于拉取/更新 profile，不再新建证书。
#
# 待填 Secrets（证书处理完后，在仓库根目录执行）：
#   base64 -i <导出的.p12> | gh secret set DIST_CERT_P12_BASE64
#   gh secret set P12_PASSWORD        # 导出 .p12 时设置的密码
# 注意：.p12 必须含私钥（钥匙串访问"我的证书"里右键导出），证书类型 Apple Distribution。
# 已有 Secrets（勿动）：ASC_API_KEY_P8_BASE64 / ASC_API_KEY_ID / ASC_API_ISSUER_ID / APPLE_TEAM_ID
#
# 2026-10-29 固定证书链路已验证全绿（run 40814210285，build 1793245738 上传成功），
# beta-* tag 触发已放开。
on:
  workflow_dispatch:
  push:
    tags:
      - 'beta-*'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ios-testflight:
    name: iOS → TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write ASC API key to disk
        run: |
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Write Config.local.xcconfig (TEAM_ID + JAVA_HOME)
        run: |
          cat > iosApp/Configuration/Config.local.xcconfig <<EOF
          TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
          JAVA_HOME=$JAVA_HOME
          EOF

      - name: Build fastlane api key json
        run: |
          python3 - <<'PYEOF'
          import base64, json, os
          key = base64.b64decode(os.environ["ASC_API_KEY_P8_BASE64"]).decode()
          cfg = {
              "key_id": os.environ["ASC_API_KEY_ID"],
              "issuer_id": os.environ["ASC_API_ISSUER_ID"],
              "key": key,
              "in_house": False,
          }
          with open(os.environ["RUNNER_TEMP"] + "/asc-key.json", "w") as f:
              json.dump(cfg, f)
          PYEOF
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}

      - name: Import fixed distribution certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ -z "$DIST_CERT_P12_BASE64" ]; then
            echo "::error::Secret DIST_CERT_P12_BASE64 未设置——按文件头说明导出 .p12 并 gh secret set"
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # 闸门：没有可签名的分发身份就中止，绝不让 xcodebuild 再去新建证书
          COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -cE 'Apple Distribution|iPhone Distribution' || true)
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::keychain 中没有有效的分发签名身份——检查 .p12 是否含私钥、P12_PASSWORD 是否正确"
            exit 1
          fi

      - name: Archive (App Store signing, build number = epoch seconds)
        run: |
          set -o pipefail
          BUILD=$(date +%s)
          # 版本号：beta-* tag 推导（beta-0.2.22 → 0.2.22），dispatch 等无 tag 场景回退 0.1.0。
          # Info.plist 引用 $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION)——写成字面量的话
          # CI 传的版本进不了包，会以固定号撞历史 build 被 ASC 静默丢弃（2026-10-29 实证）
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          MV="${TAG#beta-}"
          case "$MV" in *.*) ;; *) MV="0.1.0" ;; esac
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MV" >> "$GITHUB_ENV"
          # manual 直签分发证书 + agentreins-appstore profile：CLI 下自动签名按"开发模式"
          # 评估、强求开发证书（Xcode GUI 才会自动切分发），manual 才能让 archive 直签分发；
          # allowProvisioningUpdates 负责按名下载/续期 profile
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AgentReins.xcarchive \
            CURRENT_PROJECT_VERSION=$BUILD \
            MARKETING_VERSION=$MV \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="agentreins-appstore" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_API_ISSUER_ID }}" \
            archive 2>&1 | tail -40

      - name: Export IPA (TestFlight / app-store-connect)
        run: |
          cat > build/ExportOptions.plist <<'PLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.sharpxia.agentreins</key>
              <string>agentreins-appstore</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLEOF
          xcodebuild \
            -exportArchive \
            -archivePath build/AgentReins.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_API_ISSUER_ID }}" \
            2>&1 | tail -60

      - name: Upload to TestFlight
        run: |
          brew install fastlane
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc-key.json" \
            --ipa build/ipa/AgentReins.ipa \
            --skip_waiting

      - name: Cleanup key material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/asc-key.json" "$RUNNER_TEMP/dist.p12"

      - name: Summary
        run: |
          echo "✅ 已上传 TestFlight（build ${{ env.BUILD_NUMBER }}）。处理约 10–30 分钟后，TestFlight app 内可见/可更新。" >> "$GITHUB_STEP_SUMMARY"
