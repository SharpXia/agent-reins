name: pbxproj-guard

# 守卫：pbxproj 里不许出现写死的 DEVELOPMENT_TEAM。
# 背景：Xcode GUI 的 Signing 页操作会把本机 Team 写回 pbxproj（已发生过一次，
# a4ea0be 连带提交、9440d67 清除）。Team 应经 gitignored 的 Config.local.xcconfig
# （本机）或工作流的 Write Config.local.xcconfig 步骤（CI）注入，见
# iosApp/Configuration/Config.xcconfig 的 TEAM_ID 空槽。
# 撞线即报红：出现于任何 push（分支/tag）与 PR。
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-hardcoded-development-team:
    name: pbxproj 无写死 DEVELOPMENT_TEAM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep guard
        run: |
          if grep -rnE 'DEVELOPMENT_TEAM[[:space:]]*=[[:space:]]*[A-Za-z0-9]' --include='*.pbxproj' .; then
            echo "::error::pbxproj 里出现了写死的 DEVELOPMENT_TEAM——多半是 Xcode GUI Signing 页写回的。请 revert 该行；不要提交，Team 由 Config.local.xcconfig（本机）/工作流注入（CI）提供。"
            exit 1
          fi
          echo "OK：pbxproj 无写死的 DEVELOPMENT_TEAM"

  # 守卫二（Hub 化方案 §7-R11）：Release 配置指向的 Info.plist 不许带 ATS 例外。
  # 背景：开发期明文连内网 Hub 的 NSAllowsArbitraryLoads 只许进 Info-Debug.plist
  #（pbxproj Debug 块 7555FFA6 指它、Release 块 7555FFA7 指 Info.plist）。
  # 守卫从 pbxproj 解析 Release 块的 INFOPLIST_FILE，再用 plistlib 检查该文件：
  # 出现 NSAppTransportSecurity 下任一放宽键即报红；解析不到 Release 的 INFOPLIST_FILE 也报红
  #（防止守卫因工程结构变化而静默失效）。
  release-plist-no-ats-exception:
    name: Release Info.plist 无 ATS 例外
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse pbxproj Release INFOPLIST_FILE and inspect plist
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, re, sys
          pbx = pathlib.Path("iosApp/iosApp.xcodeproj/project.pbxproj").read_text()
          blocks = re.findall(r"\w+ /\* Release \*/ = \{(.*?)\n\t\t\};", pbx, flags=re.S)
          files = []
          for b in blocks:
              m = re.search(r'INFOPLIST_FILE = "?([^";]+)"?;', b)
              if m:
                  files.append(m.group(1))
          if not files:
              print("::error::pbxproj 里没有解析到 Release 配置的 INFOPLIST_FILE——守卫失效，请检查工程结构")
              sys.exit(1)
          forbidden = {"NSExceptionDomains", "NSAllowsArbitraryLoads", "NSAllowsLocalNetworking",
                       "NSAllowsArbitraryLoadsInWebContent", "NSAllowsArbitraryLoadsForMedia"}
          bad = False
          for rel in files:
              path = pathlib.Path("iosApp") / rel
              with path.open("rb") as f:
                  plist = plistlib.load(f)
              ats = plist.get("NSAppTransportSecurity") or {}
              hit = sorted(forbidden & set(ats.keys()))
              if hit:
                  print(f"::error file={path}::Release plist 带 ATS 例外 {hit}——明文例外只许进 Info-Debug.plist；切 https 后 Debug 例外也应整体删除")
                  bad = True
              else:
                  print(f"OK：{path} 无 ATS 例外")
          sys.exit(1 if bad else 0)
          PY
